<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🕰️ World Clock</title>
    <link rel="stylesheet" href="src/style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.37/moment-timezone-with-data-1970-2030.min.js"></script>
  </head>
  <body>
    <div class="page-container">
      <header><h1>World Clock</h1></header>
      <main>
        <h2>View times below, or choose a city from the drop-down menu.</h2>
        <select name="cities" id="cities">
          <option value="London">London</option>
          <option value="Paris">Paris</option>
          <option value="Sydney">Sydney</option>
          <option value="Manila">Manila</option>
          <option value="Los Angeles">Los Angeles</option>
          <option value="New York">New York</option>
        </select>
        <div class="times">
          <div class="city">
            <div class="city-name"><h3>London 🇬🇧</h3></div>
            <div class="city-date">21st November 2025</div>
            <div class="city-time">11:36:25 AM</div>
          </div>
          <div class="city">
            <div class="city-name"><h3>Paris 🇫🇷</h3></div>
            <div class="city-date">21st November 2025</div>
            <div class="city-time">12:36:25 AM</div>
          </div>
        </div>
      </main>
      <footer>
        <p>
          This app was coded with ❤️ by
          <a href="https://www.shecodes.io/graduates/179915-vivialyn-joynson"
            >Viv</a
          >, is open-sourced on
          <a href="https://github.com/vivialyn14">GitHub</a>
          and hosted on
          <a href="https://render.com">Render</a>.
        </p>
      </footer>
    </div>
    <script src="src/app.js"></script>
  </body>
</html>
