<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🕰️ World Clock</title>
    <link rel="stylesheet" href="src/style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.5.37/moment-timezone-with-data-1970-2030.min.js"></script>
  </head>
  <body>
    <div class="app-container">
      <header><h1>World Clock</h1></header>
      <main>
        <p class="subtitle">
          Choose a city from the drop-down menu to see the current time and
          date.
        </p>
        <select name="cities" id="city-select">
          <option value="">Select a city...</option>
          <option value="current">My current location</option>
          <option value="Europe/London">London</option>
          <option value="Europe/Paris">Paris</option>
          <option value="Australia/Sydney">Sydney</option>
          <option value="Asia/Manila">Manila</option>
          <option value="America/Los_Angeles">Los Angeles</option>
          <option value="America/New_York">New York</option>
        </select>
        <div class="times" id="times"></div>
      </main>
      <footer>
        <p>
          This app was coded by
          <a href="https://www.shecodes.io/graduates/179915-vivialyn-joynson"
            >Viv</a
          >, is open-sourced on
          <a href="https://github.com/vivialyn14">GitHub</a>
          and hosted on
          <a href="https://render.com">Render</a>.
        </p>
      </footer>
    </div>
    <script src="src/app.js"></script>
  </body>
</html>
